name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24.21.0
  # llama.cpp's Vulkan backend builds against the Vulkan SDK: LunarG's on Windows, Ubuntu's packages on Linux.
  VULKAN_SDK_VERSION: 1.4.357.0
  UBUNTU_LIBVULKAN_DEV: 1.3.275.0-1build1
  UBUNTU_GLSLC: 2023.8-1build1
  UBUNTU_SPIRV_HEADERS: 1.6.1+1.4.309.0-1~ubuntu0.24.04.2

defaults:
  run:
    shell: bash

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: macOS arm64
            os: macos-15
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Install the Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe --fail --location --retry 5 --output $installer `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Start-Process -FilePath $installer -Wait -PassThru `
            -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin"

      - name: Install the Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "libvulkan-dev=$UBUNTU_LIBVULKAN_DEV" \
            "glslc=$UBUNTU_GLSLC" "spirv-headers=$UBUNTU_SPIRV_HEADERS"

      - uses: Swatinem/rust-cache@v2.9.2

      # build.rs fetches and builds llama.cpp inside each build script's OUT_DIR (clippy and test get one each).
      # Cargo only reruns cmake there, which finds the restored build up to date.
      - name: Cache llama.cpp build
        uses: actions/cache@v6.1.0
        with:
          path: target/debug/build/trove-llama-*/out
          key: llama-cpp-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-vulkan-${{ runner.os == 'Linux' && format('{0}-{1}-{2}', env.UBUNTU_LIBVULKAN_DEV, env.UBUNTU_GLSLC, env.UBUNTU_SPIRV_HEADERS) || env.VULKAN_SDK_VERSION }}-${{ hashFiles('Cargo.lock', 'crates/trove-llama/build.rs', 'crates/trove-llama/*.patch') }}

      - name: Read the model pin
        id: model
        run: |
          pin() {
            local value
            value=$(sed -n "s/^pub const $1: &str = \"\(.*\)\";$/\1/p" crates/trove-core/src/model_setup.rs)
            if [ -z "$value" ]; then
              echo "::error::$1 not found in crates/trove-core/src/model_setup.rs"
              exit 1
            fi
            echo "$value"
          }
          repo=$(pin MODEL_REPO)
          revision=$(pin MODEL_REVISION)
          file=$(pin MODEL_FILE)
          sha256=$(pin MODEL_SHA256)
          {
            echo "repo=$repo"
            echo "revision=$revision"
            echo "file=$file"
            echo "sha256=$sha256"
            echo "hf-folder=models--${repo//\//--}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache model
        id: model-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface/hub/${{ steps.model.outputs.hf-folder }}
          key: model-${{ runner.os }}-${{ steps.model.outputs.revision }}-${{ steps.model.outputs.file }}

      # Same layout as `hf download`, which the embedder tests read.
      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          REPO: ${{ steps.model.outputs.repo }}
          REVISION: ${{ steps.model.outputs.revision }}
          FILE: ${{ steps.model.outputs.file }}
          SHA256: ${{ steps.model.outputs.sha256 }}
          FOLDER: ${{ steps.model.outputs.hf-folder }}
        run: |
          snapshot="$HOME/.cache/huggingface/hub/$FOLDER/snapshots/$REVISION"
          mkdir -p "$snapshot"
          curl --fail --location --retry 5 --output "$snapshot/$FILE.partial" \
            "https://huggingface.co/$REPO/resolve/$REVISION/$FILE"
          actual=$(openssl dgst -sha256 -r "$snapshot/$FILE.partial" | cut -d ' ' -f 1)
          if [ "$actual" != "$SHA256" ]; then
            echo "::error::$FILE has SHA-256 $actual, expected $SHA256"
            exit 1
          fi
          mv "$snapshot/$FILE.partial" "$snapshot/$FILE"

      - name: Clippy
        run: cargo clippy --locked --all-targets -- --deny warnings

      - name: Test
        run: cargo test --locked

      # The client checks generate the API schema and run their tests against this build of trove.
      - uses: oven-sh/setup-bun@v2.2.0
        if: runner.os == 'Linux'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check the clients
        if: runner.os == 'Linux'
        working-directory: clients
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
