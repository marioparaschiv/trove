name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2025
          - platform: macos-arm64
            os: macos-15
          - platform: linux-x86_64
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the tag names the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Build
        run: cargo build --release --locked --package trove

      - name: Package
        run: scripts/package-release.sh "${{ matrix.platform }}" "$VERSION" target/release dist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: trove-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the plugin manifest names the tag
        run: |
          version=$(jq --raw-output .version clients/obsidian/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match clients/obsidian/manifest.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The plugin downloads the archives of this release and checks them against the hashes bundled into it.
      - name: Bundle the Obsidian plugin
        run: |
          pin=$(scripts/release-pin.sh "$VERSION" "$GITHUB_REPOSITORY" dist)
          echo "$pin"
          cd clients
          bun install --frozen-lockfile
          cd obsidian
          TROVE_RELEASE_PIN="$pin" bun run bundle

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Trove $VERSION" --generate-notes \
            dist/* clients/obsidian/main.js clients/obsidian/manifest.json
