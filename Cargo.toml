[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
trove-core = { path = "crates/trove-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
humantime = "2.4.0"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
